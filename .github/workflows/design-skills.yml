name: Design skill integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  design-skills:
    name: Design skill integrity
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check_design_skills.py
